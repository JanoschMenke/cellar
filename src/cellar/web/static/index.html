<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cellar</title>
<style>
  :root {
    --ground: #ffffff; --panel: #f8fafb; --panel-2: #f2f5f7;
    --ink: #10161a; --muted: #5b6670; --faint: #8a949c;
    --line: #e4e8ec; --line-strong: #d3dade;
    --accent: #0e7c86; --accent-weak: #e6f2f3;
    --good: #2e7d5b; --good-weak: #e7f2ec;
    --err: #b23b3b; --err-weak: #f6e8e8;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--panel-2); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.55; }
  .app { max-width: 760px; margin: 0 auto; height: 100vh; min-height: 520px;
    display: grid; grid-template-rows: auto 1fr auto;
    background: var(--ground); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent);
    display: grid; place-items: center; color: #fff; font-size: 15px; }
  .wordmark { font-weight: 650; letter-spacing: -0.01em; }
  .tagline { color: var(--muted); font-size: 12.5px; }
  .spacer { flex: 1; }
  .chip { font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); padding: 4px 9px; border-radius: 6px; }

  .messages { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
  .eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 10.5px;
    font-weight: 600; color: var(--faint); margin-bottom: 6px; }
  .user .bubble { background: var(--accent-weak); border: 1px solid #cfe6e8; color: #0c3f45;
    padding: 10px 13px; border-radius: 10px 10px 10px 3px; white-space: pre-wrap; }
  .assistant .body { white-space: pre-wrap; }
  .text { white-space: pre-wrap; }
  .caret { display: inline-block; width: 7px; height: 15px; background: var(--accent);
    vertical-align: -2px; margin-left: 1px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }

  .tool { border: 1px solid var(--line); border-radius: 9px; background: #fff;
    padding: 10px 12px; margin: 10px 0; }
  .tool__head { display: flex; align-items: center; gap: 9px; }
  .tool__dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--line-strong); }
  .tool.running .tool__dot { background: var(--accent); animation: pulse 1.1s infinite; }
  .tool.done .tool__dot { background: var(--good); }
  .tool.error .tool__dot { background: var(--err); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(14,124,134,.45); }
    70% { box-shadow: 0 0 0 6px rgba(14,124,134,0); } 100% { box-shadow: 0 0 0 0 rgba(14,124,134,0); } }
  .tool__name { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  .tool__status { margin-left: auto; font-size: 11px; color: var(--muted); }
  .tool.running .tool__status { color: var(--accent); }
  .tool.done .tool__status { color: var(--good); }
  .tool.error .tool__status { color: var(--err); }
  .tool__result { margin-top: 8px; padding-left: 18px; font-size: 12.5px; color: var(--muted);
    font-family: var(--mono); word-break: break-word; }
  .tool.error .tool__result { color: var(--err); }
  .tool__result:empty { display: none; }

  .composer { border-top: 1px solid var(--line); padding: 14px 20px; display: flex; gap: 10px; }
  .composer input { flex: 1; border: 1px solid var(--line-strong); border-radius: 9px;
    padding: 10px 13px; font-family: var(--sans); font-size: 14px; color: var(--ink); background: var(--panel); }
  .composer input:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
  .send { border: none; background: var(--accent); color: #fff; padding: 10px 16px;
    border-radius: 9px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
  .send:disabled { opacity: .5; cursor: default; }
  .send:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .caret, .tool.running .tool__dot { animation: none; } }
</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="mark">🧫</div>
      <div>
        <div class="wordmark">cellar</div>
        <div class="tagline">agentic model matchmaker</div>
      </div>
      <div class="spacer"></div>
      <span class="chip" id="model">connecting…</span>
    </div>

    <div class="messages" id="messages"></div>

    <form class="composer" id="composer">
      <input id="input" autocomplete="off"
        placeholder='Ask something — e.g. how many characters are in "hello world"?' aria-label="Message cellar" />
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </div>

<script>
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const modelChip = document.getElementById("model");

  fetch("/config").then((r) => r.ok ? r.json() : null).then((c) => {
    if (c) modelChip.textContent = c.model;
  }).catch(() => { modelChip.textContent = "ready"; });

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function addUser(text) {
    const wrap = el("div", "user");
    wrap.appendChild(el("div", "eyebrow", "you"));
    wrap.appendChild(el("div", "bubble", text));
    messagesEl.appendChild(wrap);
  }

  function addAssistant() {
    const wrap = el("div", "assistant");
    wrap.appendChild(el("div", "eyebrow", "cellar"));
    const body = el("div", "body");
    const caret = el("span", "caret");
    body.appendChild(caret);
    wrap.appendChild(body);
    messagesEl.appendChild(wrap);
    return { body, caret, cursorText: null };
  }

  function appendText(a, t) {
    if (!a.cursorText) {
      a.cursorText = el("span", "text");
      a.body.insertBefore(a.cursorText, a.caret);
    }
    a.cursorText.textContent += t;
  }

  function addToolCard(a, name) {
    const card = el("div", "tool running");
    const head = el("div", "tool__head");
    head.appendChild(el("span", "tool__dot"));
    head.appendChild(el("span", "tool__name", name || "tool"));
    const status = el("span", "tool__status", "running…");
    head.appendChild(status);
    card.appendChild(head);
    const res = el("div", "tool__result");
    card.appendChild(res);
    card._status = status;
    card._res = res;
    a.body.insertBefore(card, a.caret);
    a.cursorText = null;
    return card;
  }

  function completeToolCard(card, ev) {
    card.classList.remove("running");
    card.classList.add(ev.is_error ? "error" : "done");
    card._status.textContent = ev.is_error ? "error" : "done";
    let line = "";
    if (ev.tool_input && Object.keys(ev.tool_input).length) {
      line += Object.entries(ev.tool_input).map(([k, v]) => k + "=" + v).join("  ") + "  →  ";
    }
    line += ev.content || "";
    card._res.textContent = line;
  }

  function send(text) {
    if (!text.trim()) return;
    input.value = "";
    sendBtn.disabled = true;
    addUser(text);
    const a = addAssistant();
    const openTools = [];
    const es = new EventSource("/chat?message=" + encodeURIComponent(text));

    es.onmessage = (e) => {
      const ev = JSON.parse(e.data);
      if (ev.kind === "text") { appendText(a, ev.text); }
      else if (ev.kind === "tool_use") { openTools.push(addToolCard(a, ev.tool_name)); }
      else if (ev.kind === "tool_result") {
        const card = openTools.shift() || addToolCard(a, ev.tool_name);
        completeToolCard(card, ev);
      }
      else if (ev.kind === "error") { appendText(a, "\n[error] " + (ev.content || "")); }
      else if (ev.kind === "done") { finish(); }
      scrollDown();
    };
    es.onerror = () => finish();

    function finish() {
      es.close();
      a.caret.remove();
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!sendBtn.disabled) send(input.value);
  });
  input.focus();
</script>
</body>
</html>
