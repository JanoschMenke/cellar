<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cellar</title>
<link rel="icon" type="image/svg+xml" href="/assets/cellar-mark-favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/tokens.css" />
<style>
  * { box-sizing: border-box; }
  ::selection { background: var(--cellar-xylem-tint); }
  html, body { height: 100%; }
  body { margin: 0; background: var(--cellar-paper); color: var(--cellar-ink);
    font-family: var(--cellar-font-body); font-size: var(--cellar-text-body); line-height: 1.6;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  .layout { display: grid; grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr);
    height: 100dvh; min-height: 520px; max-width: 880px; margin: 0 auto; overflow: hidden;
    background: var(--cellar-surface);
    border-left: 1px solid var(--cellar-border); border-right: 1px solid var(--cellar-border);
    box-shadow: 0 24px 80px -48px rgba(26,28,26,.28); }
  .layout.has-results { grid-template-columns: 1fr 1fr; max-width: 1500px; }
  .app { min-width: 0; height: 100%; min-height: 0; overflow: hidden;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--cellar-surface); }

  /* --- Persistent results panel (only shown once recommendations arrive) --- */
  .results { display: none; }
  .layout.has-results .results { min-width: 0; height: 100%; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column;
    background: var(--cellar-paper); border-left: 1px solid var(--cellar-border); }
  .results__head { flex: none; padding: 16px 20px; border-bottom: 1px solid var(--cellar-border); background: var(--cellar-surface); }
  .results__title { font-family: var(--cellar-font-display); font-weight: 700; font-size: var(--cellar-text-h2);
    letter-spacing: -0.02em; color: var(--cellar-ink); }
  .results__sub { font-family: var(--cellar-font-mono); font-size: 11.5px; color: var(--cellar-ink-muted); margin-top: 3px; }
  .results__body { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 0 15px 15px; display: flex; flex-direction: column; gap: 11px; }
  .results__body > :first-child { margin-top: 15px; }
  .results__empty { color: var(--cellar-ink-faint); font-size: 13px; line-height: 1.65; text-align: center; margin: 34px 10px 0; }
  @media (max-width: 900px) {
    .layout.has-results { grid-template-columns: 1fr; grid-template-rows: 55dvh 45dvh; max-width: 880px; }
    .layout.has-results .results { border-left: none; border-top: 1px solid var(--cellar-border); }
  }

  /* --- Header --- */
  .topbar { display: flex; align-items: center; gap: 13px; padding: 18px 26px;
    border-bottom: 1px solid var(--cellar-border); }
  .mark { width: 30px; height: 30px; color: var(--cellar-xylem); display: grid; place-items: center; flex: none; }
  .mark svg { width: 100%; height: 100%; }
  .wordmark { font-family: var(--cellar-font-display); font-weight: 700; font-size: var(--cellar-text-h2);
    letter-spacing: -0.02em; color: var(--cellar-ink); line-height: 1.05; }
  .tagline { color: var(--cellar-ink-muted); font-size: 12.5px; margin-top: 1px; }
  .spacer { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 7px; font-family: var(--cellar-font-mono);
    font-size: 11px; letter-spacing: .04em; color: var(--cellar-ink-muted); background: var(--cellar-paper);
    border: 1px solid var(--cellar-border); padding: 6px 11px; border-radius: var(--cellar-radius-pill);
    font-variant-numeric: tabular-nums; }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--cellar-conf-moderate); box-shadow: 0 0 0 3px var(--cellar-xylem-tint); }

  .newbtn { font-family: var(--cellar-font-body); font-size: 12.5px; color: var(--cellar-ink-muted);
    background: var(--cellar-surface); border: 1px solid var(--cellar-border-strong);
    border-radius: var(--cellar-radius-pill); padding: 6px 13px; cursor: pointer;
    transition: border-color .15s ease, color .15s ease; }
  .newbtn:hover { color: var(--cellar-xylem); border-color: var(--cellar-xylem-border); }
  .newbtn:focus-visible { outline: 2px solid var(--cellar-xylem); outline-offset: 2px; }

  /* --- Messages --- */
  .messages { overflow-y: auto; padding: 26px; display: flex; flex-direction: column; gap: 24px; }
  .messages::-webkit-scrollbar { width: 10px; }
  .messages::-webkit-scrollbar-thumb { background: var(--cellar-border-strong); border-radius: 999px;
    border: 3px solid var(--cellar-surface); }
  .messages::-webkit-scrollbar-thumb:hover { background: var(--cellar-ink-faint); }
  .user, .assistant { animation: rise .28s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .eyebrow { font-family: var(--cellar-font-mono); text-transform: uppercase; letter-spacing: 0.16em;
    font-size: var(--cellar-text-label); font-weight: 600; color: var(--cellar-ink-faint); margin-bottom: 8px; }
  .user .bubble { display: inline-block; max-width: 88%; background: var(--cellar-xylem-tint);
    border: 1px solid var(--cellar-xylem-border); color: var(--cellar-ink); padding: 11px 15px;
    border-radius: 12px 12px 12px 4px; white-space: pre-wrap; box-shadow: var(--cellar-shadow-card); }
  .caret { display: inline-block; width: 7px; height: 15px; background: var(--cellar-xylem);
    vertical-align: -2px; margin-left: 1px; border-radius: 1px; animation: blink 1.05s steps(2) infinite; }
  @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }

  /* --- Empty state --- */
  .empty { margin: auto; max-width: 480px; padding: 32px 20px; display: flex; flex-direction: column;
    align-items: center; text-align: center; animation: rise .4s ease both; }
  .empty__mark { width: 52px; height: 52px; color: var(--cellar-xylem); margin-bottom: 20px; }
  .empty__mark svg { width: 100%; height: 100%; }
  .empty__title { font-family: var(--cellar-font-display); font-weight: 700; font-size: var(--cellar-text-h1);
    letter-spacing: -0.02em; color: var(--cellar-ink); }
  .empty__sub { font-family: var(--cellar-font-mono); font-size: var(--cellar-text-data);
    color: var(--cellar-ink-muted); margin-top: 8px; }
  .empty__hint { font-family: var(--cellar-font-mono); font-size: var(--cellar-text-label);
    text-transform: uppercase; letter-spacing: .14em; color: var(--cellar-ink-faint); margin: 28px 0 10px; }
  .empty__prompts { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .example { font-family: var(--cellar-font-body); font-size: 13.5px; text-align: left; color: var(--cellar-ink);
    background: var(--cellar-surface); border: 1px solid var(--cellar-border); border-radius: var(--cellar-radius-md);
    padding: 12px 15px; cursor: pointer; box-shadow: var(--cellar-shadow-card);
    transition: border-color .15s ease, background .15s ease, transform .15s ease; }
  .example:hover { border-color: var(--cellar-xylem-border); background: var(--cellar-xylem-tint); transform: translateY(-1px); }
  .example:focus-visible { outline: 2px solid var(--cellar-xylem); outline-offset: 2px; }

  /* --- Markdown-rendered assistant text --- */
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 .65em; }
  .md h1, .md h2, .md h3, .md h4 { font-family: var(--cellar-font-display); font-weight: 600;
    line-height: 1.25; letter-spacing: -0.01em; margin: 1.1em 0 .45em; color: var(--cellar-ink);
    text-wrap: balance; }
  .md h1 { font-size: var(--cellar-text-h1); }
  .md h2 { font-size: var(--cellar-text-h2); }
  .md h3 { font-size: var(--cellar-text-lg); }
  .md h4 { font-size: var(--cellar-text-body); }
  .md ul, .md ol { margin: .45em 0 .75em; padding-left: 1.4em; }
  .md li { margin: .25em 0; }
  .md li::marker { color: var(--cellar-sage); }
  .md strong { font-weight: 600; }
  .md em { font-style: italic; }
  .md a { color: var(--cellar-xylem); text-decoration: underline; text-decoration-color: var(--cellar-xylem-border);
    text-underline-offset: 2px; transition: text-decoration-color .15s ease; }
  .md a:hover { text-decoration-color: var(--cellar-xylem); }
  .md code { font-family: var(--cellar-font-mono); font-size: 12.5px; background: var(--cellar-paper);
    border: 1px solid var(--cellar-border); padding: 1px 5px; border-radius: var(--cellar-radius-sm); }
  .md pre { background: var(--cellar-paper); border: 1px solid var(--cellar-border);
    border-radius: var(--cellar-radius-md); padding: 13px 15px; overflow-x: auto; margin: .7em 0; }
  .md pre code { background: none; border: none; padding: 0; font-size: var(--cellar-text-data); }
  .md blockquote { margin: .7em 0; padding: 3px 0 3px 15px; border-left: 3px solid var(--cellar-sage);
    color: var(--cellar-ink-muted); }
  .md hr { border: none; border-top: 1px solid var(--cellar-border); margin: 1.1em 0; }
  .md table { border-collapse: collapse; margin: .7em 0; font-size: var(--cellar-text-sm);
    font-variant-numeric: tabular-nums; width: 100%; }
  .md th, .md td { border: 1px solid var(--cellar-border); padding: 7px 11px; text-align: left; }
  .md th { font-family: var(--cellar-font-mono); font-size: var(--cellar-text-label);
    text-transform: uppercase; letter-spacing: .08em; color: var(--cellar-ink-muted); background: var(--cellar-paper); }
  .md tbody tr:nth-child(even) td { background: rgba(247,246,242,.55); }

  /* --- Tool timeline --- */
  /* --- Tool activity (one consolidated, human-readable panel per turn) --- */
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52,87,59,.4); }
    70% { box-shadow: 0 0 0 6px rgba(52,87,59,0); } 100% { box-shadow: 0 0 0 0 rgba(52,87,59,0); } }
  .activity { border: 1px solid var(--cellar-border); border-radius: var(--cellar-radius-md);
    background: var(--cellar-surface); box-shadow: var(--cellar-shadow-card); margin: 13px 0; }
  .activity__head { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; }
  .activity__head::-webkit-details-marker { display: none; }
  .activity__dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--cellar-xylem);
    animation: pulse 1.15s infinite; }
  .activity.is-done .activity__dot { background: var(--cellar-conf-strong); animation: none; }
  .activity__title { font-size: 12.5px; color: var(--cellar-ink); }
  .activity__count { margin-left: auto; font-family: var(--cellar-font-mono); font-size: 11px; color: var(--cellar-ink-faint); }
  .activity__chev { color: var(--cellar-ink-faint); font-size: 10px; transition: transform .15s ease; }
  .activity[open] .activity__chev { transform: rotate(90deg); }
  .activity__steps { padding: 2px 14px 12px 33px; display: flex; flex-direction: column; gap: 8px; }
  .step { display: flex; align-items: center; gap: 9px; font-size: 12px; }
  .step__dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--cellar-border-strong); }
  .step.running .step__dot { background: var(--cellar-xylem); animation: pulse 1.15s infinite; }
  .step.done .step__dot { background: var(--cellar-conf-strong); }
  .step.error .step__dot { background: var(--cellar-signal); }
  .step__label { color: var(--cellar-ink-muted); }
  .step__sum { margin-left: auto; font-family: var(--cellar-font-mono); font-size: 11px; color: var(--cellar-ink-faint); }
  .step.error .step__sum { color: var(--cellar-signal); }

  /* --- Recommendation cards --- */
  .rec-card { background: var(--cellar-surface); border: 1px solid var(--cellar-border);
    border-radius: var(--cellar-radius-md); box-shadow: var(--cellar-shadow-card);
    transition: box-shadow .18s ease; }
  .rec-card[open] { box-shadow: var(--cellar-shadow-pop); }
  .rec-card--rejected { opacity: .82; }
  .rec-head { display: flex; align-items: center; gap: 9px; flex-wrap: nowrap; cursor: pointer;
    list-style: none; padding: 16px 15px; box-sizing: border-box;
    position: sticky; top: 0; z-index: 2; background: var(--cellar-surface);
    border-radius: var(--cellar-radius-md); }
  .rec-card[open] .rec-head { border-radius: var(--cellar-radius-md) var(--cellar-radius-md) 0 0;
    border-bottom: 1px solid var(--cellar-border); }
  .rec-head::-webkit-details-marker { display: none; }
  .rec-head:hover { background: var(--cellar-paper); }
  .rec-chevron { font-family: var(--cellar-font-mono); font-size: 12px; color: var(--cellar-ink-faint);
    transition: transform .16s ease; flex: none; }
  .rec-card[open] .rec-chevron { transform: rotate(90deg); }
  .rec-rank { font-family: var(--cellar-font-mono); font-size: 12px; color: var(--cellar-ink-faint); font-variant-numeric: tabular-nums; flex: none; }
  .rec-name { font-family: var(--cellar-font-display); font-weight: 600; font-size: var(--cellar-text-body);
    letter-spacing: -0.01em; color: var(--cellar-ink); line-height: 1.4;
    flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rec-body { padding: 14px 15px 15px; }
  .rec-chip { font-family: var(--cellar-font-mono); font-size: 11px; font-weight: 600; padding: 4px 10px;
    border-radius: var(--cellar-radius-sm); border: 1px solid transparent; white-space: nowrap; flex: none; }
  .rec-badge { font-family: var(--cellar-font-mono); font-size: 11px; font-weight: 600; padding: 4px 11px;
    border-radius: var(--cellar-radius-pill); white-space: nowrap; flex: none; }
  .rec-badge--yes { color: var(--cellar-xylem); background: var(--cellar-xylem-tint); border: 1px solid var(--cellar-xylem-border); }
  .rec-badge--no { color: var(--cellar-signal); background: var(--cellar-signal-tint); border: 1px solid #e8dcc0; }
  .rec-why { background: var(--cellar-xylem-tint); border: 1px solid var(--cellar-xylem-border);
    border-radius: var(--cellar-radius-md); padding: 11px 13px; margin-bottom: 13px; }
  .rec-why__label { font-family: var(--cellar-font-mono); font-size: var(--cellar-text-label);
    letter-spacing: .12em; text-transform: uppercase; color: var(--cellar-xylem); margin-bottom: 5px; }
  .rec-why__text { font-size: 13px; color: var(--cellar-ink); line-height: 1.5; }
  .rec-why__text a { color: var(--cellar-xylem); }
  .rec-why__text > :first-child { margin-top: 0; } .rec-why__text > :last-child { margin-bottom: 0; }
  .rec-proscons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .rec-proscons { grid-template-columns: 1fr; } }
  .rec-pc__col { border: 1px solid var(--cellar-border); border-radius: var(--cellar-radius-md); padding: 11px 12px; }
  .rec-pc__col--pro { background: var(--cellar-xylem-tint); border-color: var(--cellar-xylem-border); }
  .rec-pc__col--con { background: var(--cellar-signal-tint); border-color: #e8dcc0; }
  .rec-pc__head { font-family: var(--cellar-font-mono); font-size: var(--cellar-text-label);
    letter-spacing: .12em; text-transform: uppercase; margin-bottom: 9px; }
  .rec-pc__col--pro .rec-pc__head { color: var(--cellar-xylem); }
  .rec-pc__col--con .rec-pc__head { color: var(--cellar-signal); }
  .rec-pc__none { font-size: 12.5px; color: var(--cellar-ink-faint); }
  .rec-pc__row { display: flex; gap: 8px; align-items: flex-start; margin: 9px 0; }
  .rec-pc__mark { font-family: var(--cellar-font-mono); line-height: 1.5; flex: none; }
  .rec-pc__mark--pro { color: var(--cellar-xylem); }
  .rec-pc__mark--con { color: var(--cellar-signal); }
  .rec-pc__body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .rec-pc__text { font-size: 12.5px; color: var(--cellar-ink); line-height: 1.4; }
  .rec-pc__src { font-size: 11px; font-family: var(--cellar-font-mono); color: var(--cellar-ink-faint); }
  .rec-pc__src a { color: var(--cellar-ink-muted); text-decoration: underline;
    text-decoration-color: var(--cellar-border-strong); text-underline-offset: 2px; }
  .rec-section { margin-top: 13px; }
  .rec-section__label { font-family: var(--cellar-font-mono); font-size: var(--cellar-text-label);
    letter-spacing: .12em; text-transform: uppercase; color: var(--cellar-ink-faint); margin-bottom: 6px; }
  .rec-note { font-size: 12.5px; color: var(--cellar-ink-muted); margin: 3px 0; padding-left: 15px; position: relative; }
  .rec-note::before { content: "•"; position: absolute; left: 3px; color: var(--cellar-sage); }
  .rec-action { font-size: 12.5px; color: var(--cellar-ink); margin: 3px 0; padding-left: 17px; position: relative; }
  .rec-action::before { content: "\2192"; position: absolute; left: 0; color: var(--cellar-xylem); font-weight: 600; }
  .rec-foot { margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--cellar-border);
    font-size: 12.5px; color: var(--cellar-ink-muted); }
  .rec-foot a { color: var(--cellar-xylem); }
  .rec-foot__label { font-family: var(--cellar-font-mono); font-size: var(--cellar-text-label);
    letter-spacing: .12em; text-transform: uppercase; color: var(--cellar-ink-faint); margin-bottom: 4px; }
  .rec-foot__val { font-size: 12.5px; color: var(--cellar-ink-muted); }
  .rec-buy { flex: none; display: inline-flex; align-items: center; }
  .rec-buy svg { display: block; }
  .rec-buy--yes { color: var(--cellar-xylem); }
  .rec-buy--no { color: var(--cellar-ink-faint); opacity: .7; }

  /* --- Composer --- */
  .composer { border-top: 1px solid var(--cellar-border); padding: 16px 26px; display: flex; gap: 11px;
    background: var(--cellar-surface); box-shadow: 0 -10px 24px -22px rgba(26,28,26,.25); }
  .composer input { flex: 1; font-family: var(--cellar-font-body); font-size: 14.5px;
    background: var(--cellar-paper); border: 1px solid var(--cellar-border-strong);
    border-radius: var(--cellar-radius-md); padding: 13px 16px; color: var(--cellar-ink);
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease; }
  .composer input::placeholder { color: var(--cellar-ink-faint); }
  .composer input:focus { outline: none; background: var(--cellar-surface);
    border-color: var(--cellar-xylem); box-shadow: 0 0 0 3px var(--cellar-xylem-tint); }
  .send { font-family: var(--cellar-font-body); font-weight: 600; font-size: 14px; border: none;
    background: var(--cellar-xylem); color: var(--cellar-paper); padding: 13px 22px;
    border-radius: var(--cellar-radius-md); cursor: pointer;
    transition: filter .15s ease, transform .1s ease; }
  .send:hover:not(:disabled) { filter: brightness(1.12); }
  .send:active:not(:disabled) { transform: translateY(1px); }
  .send:disabled { opacity: .5; cursor: default; }
  .send:focus-visible { outline: 2px solid var(--cellar-ink); outline-offset: 2px; }
  .send--stop { background: var(--cellar-signal); }
  .stopped { margin-top: 8px; font-family: var(--cellar-font-mono); font-size: 11px;
    letter-spacing: .04em; color: var(--cellar-ink-faint); }

  @media (max-width: 560px) { .topbar, .messages, .composer { padding-left: 18px; padding-right: 18px; } }
  @media (prefers-reduced-motion: reduce) {
    .caret, .activity__dot, .step.running .step__dot { animation: none; }
    .user, .assistant, .empty { animation: none; }
  }
</style>
</head>
<body>
  <div class="layout">
    <div class="app">
      <div class="topbar">
        <span class="mark">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" fill="none" role="img" aria-label="Cellar">
            <circle cx="44" cy="44" r="39" stroke="currentColor" stroke-width="6"></circle>
            <circle cx="55" cy="37" r="13" fill="currentColor"></circle>
          </svg>
        </span>
        <div>
          <div class="wordmark">Cellar</div>
          <div class="tagline">Where hypotheses come to culture</div>
        </div>
        <div class="spacer"></div>
        <button class="newbtn" id="new-btn" type="button" title="Start a new investigation (clears the conversation and evidence)">New investigation</button>
        <span class="chip" id="model">connecting…</span>
      </div>

      <div class="messages" id="messages"></div>

      <form class="composer" id="composer">
        <input id="input" autocomplete="off"
          placeholder="Ask — e.g. which model should I use for ZDHHC20 in PDAC for target validation?"
          aria-label="Message cellar" />
        <button class="send" id="send" type="submit">Send</button>
      </form>
    </div>

    <aside class="results" id="results">
      <div class="results__head">
        <div class="results__title">Recommendations</div>
        <div class="results__sub" id="results-sub">Ranked models appear here.</div>
      </div>
      <div class="results__body" id="results-body">
        <div class="results__empty" id="results-empty">
          Ask for a model — e.g. “which model for ZDHHC20 in PDAC, target validation?” — and the
          ranked cell lines show up here. Click any card to expand it.
        </div>
      </div>
    </aside>
  </div>

<script>
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const modelChip = document.getElementById("model");
  const resultsBody = document.getElementById("results-body");
  const resultsSub = document.getElementById("results-sub");
  const layoutEl = document.querySelector(".layout");
  let cardsByName = {};
  function normName(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }

  let activeES = null;
  let activeFinish = null;

  function setGenerating(on) {
    input.disabled = on;
    sendBtn.textContent = on ? "Stop" : "Send";
    sendBtn.classList.toggle("send--stop", on);
  }

  function stopGeneration() {
    if (activeFinish) activeFinish(true);
  }

  fetch("/config").then((r) => r.ok ? r.json() : null).then((c) => {
    if (c) modelChip.textContent = c.model;
  }).catch(() => { modelChip.textContent = "ready"; });

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function renderInline(s) {
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return "\u0001" + (codes.length - 1) + "\u0001"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
    s = s.replace(/(^|[^\w])_([^_\s][^_]*?)_(?![\w])/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => "<code>" + codes[+i] + "</code>");
    return s;
  }

  const BLOCK_START = /^(#{1,6}\s|>|```|\s*[-*+]\s|\s*\d+\.\s|\s*\|)/;

  function renderTableRow(line, tag) {
    const cells = line.trim().replace(/^\||\|$/g, "").split("|");
    return "<tr>" + cells.map((c) => "<" + tag + ">" + renderInline(escapeHtml(c.trim())) + "</" + tag + ">").join("") + "</tr>";
  }

  function renderMarkdown(src) {
    const lines = src.split("\n");
    let html = "", i = 0, listType = null;
    const closeList = () => { if (listType) { html += "</" + listType + ">"; listType = null; } };
    while (i < lines.length) {
      const line = lines[i];
      if (/^```/.test(line)) {
        closeList(); i++;
        let code = "";
        while (i < lines.length && !/^```/.test(lines[i])) { code += lines[i] + "\n"; i++; }
        i++;
        html += "<pre><code>" + escapeHtml(code.replace(/\n$/, "")) + "</code></pre>";
        continue;
      }
      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { closeList(); const lvl = h[1].length; html += "<h" + lvl + ">" + renderInline(escapeHtml(h[2])) + "</h" + lvl + ">"; i++; continue; }
      if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) { closeList(); html += "<hr>"; i++; continue; }
      if (/^>\s?/.test(line)) {
        closeList(); let quote = "";
        while (i < lines.length && /^>\s?/.test(lines[i])) { quote += lines[i].replace(/^>\s?/, "") + "\n"; i++; }
        html += "<blockquote>" + renderMarkdown(quote.trim()) + "</blockquote>";
        continue;
      }
      if (/^\s*\|/.test(line) && /\|/.test(line.slice(1))) {
        closeList();
        const rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
        const isSep = (r) => /^[\s|:-]+$/.test(r);
        let head = "", bodyRows = rows;
        if (rows.length >= 2 && isSep(rows[1])) { head = "<thead>" + renderTableRow(rows[0], "th") + "</thead>"; bodyRows = rows.slice(2); }
        const body = bodyRows.filter((r) => !isSep(r)).map((r) => renderTableRow(r, "td")).join("");
        html += "<table>" + head + "<tbody>" + body + "</tbody></table>";
        continue;
      }
      const ul = line.match(/^\s*[-*+]\s+(.*)$/);
      if (ul) { if (listType !== "ul") { closeList(); html += "<ul>"; listType = "ul"; } html += "<li>" + renderInline(escapeHtml(ul[1])) + "</li>"; i++; continue; }
      const ol = line.match(/^\s*\d+\.\s+(.*)$/);
      if (ol) { if (listType !== "ol") { closeList(); html += "<ol>"; listType = "ol"; } html += "<li>" + renderInline(escapeHtml(ol[1])) + "</li>"; i++; continue; }
      if (/^\s*$/.test(line)) { closeList(); i++; continue; }
      closeList();
      let para = line; i++;
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !BLOCK_START.test(lines[i]) && !/^\s*(---|\*\*\*|___)\s*$/.test(lines[i])) {
        para += "\n" + lines[i]; i++;
      }
      html += "<p>" + renderInline(escapeHtml(para)).replace(/\n/g, "<br>") + "</p>";
    }
    closeList();
    return html;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }
  function isNearBottom() {
    return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 60;
  }

  const EXAMPLES = [
    "Which model should I use for ZDHHC20 in PDAC for target validation?",
    "Does the pancreatic line MIA PaCa-2 carry a KRAS mutation?",
    "Recommend a model for KRAS in colorectal cancer for an HTS screen",
  ];

  function renderEmptyState() {
    const wrap = el("div", "empty");
    wrap.id = "empty";
    const mark = el("div", "empty__mark");
    mark.innerHTML = document.querySelector(".mark svg").outerHTML;
    wrap.appendChild(mark);
    wrap.appendChild(el("div", "empty__title", "Cellar"));
    wrap.appendChild(el("div", "empty__sub", "Find the right model to test your hypothesis"));
    wrap.appendChild(el("div", "empty__hint", "Try asking"));
    const prompts = el("div", "empty__prompts");
    EXAMPLES.forEach((p) => {
      const b = el("button", "example", p);
      b.type = "button";
      b.addEventListener("click", () => send(p));
      prompts.appendChild(b);
    });
    wrap.appendChild(prompts);
    messagesEl.appendChild(wrap);
  }

  function clearEmptyState() {
    const e = document.getElementById("empty");
    if (e) e.remove();
  }

  function addUser(text) {
    const wrap = el("div", "user");
    wrap.appendChild(el("div", "eyebrow", "you"));
    wrap.appendChild(el("div", "bubble", text));
    messagesEl.appendChild(wrap);
  }

  function addAssistant() {
    const wrap = el("div", "assistant");
    wrap.appendChild(el("div", "eyebrow", "Cellar"));
    const body = el("div", "body");
    const caret = el("span", "caret");
    body.appendChild(caret);
    wrap.appendChild(body);
    messagesEl.appendChild(wrap);
    return { body, caret, cursorText: null };
  }

  function appendText(a, t) {
    if (!a.cursorText) {
      a.cursorText = el("div", "text md");
      a.cursorText._raw = "";
      a.body.insertBefore(a.cursorText, a.caret);
    }
    a.cursorText._raw += t;
    a.cursorText.innerHTML = renderMarkdown(a.cursorText._raw);
  }

  const TOOL_LABELS = {
    target_disease_evidence: "Checking target–disease evidence",
    protein_evidence: "Checking protein evidence",
    protein_atlas_profile: "Reading the protein atlas",
    isoform_risk: "Checking isoform risk",
    pathway_relations: "Mapping pathway relations",
    literature_search: "Searching the literature",
    find_cell_model: "Finding the cell model",
    cell_line_provenance: "Checking cell-line provenance",
    gene_dependency: "Checking CRISPR dependency",
    cell_model_gene_mutations: "Checking mutations",
    build_recommendations: "Building recommendations",
    recommend_models: "Building recommendations",
  };
  function toolLabel(name) {
    return TOOL_LABELS[name] || (name || "tool").replace(/_/g, " ");
  }

  function toolSummary(name, ev) {
    if (ev.is_error) return "failed";
    let d = null;
    try { d = JSON.parse(ev.content); } catch (e) { d = null; }
    if (!d || typeof d !== "object") return "done";
    if (d.found === false) return "not found";
    if (name === "find_cell_model" && d.sidm_id) return d.sidm_id;
    if (name === "cell_model_gene_mutations" && Array.isArray(d.mutations))
      return d.mutations.length + " mutation" + (d.mutations.length === 1 ? "" : "s");
    if ((name === "build_recommendations" || name === "recommend_models") && Array.isArray(d.cards))
      return d.cards.length + " model" + (d.cards.length === 1 ? "" : "s") + " ranked";
    if (name === "gene_dependency" && "is_dependency" in d) return d.is_dependency ? "is a dependency" : "not a dependency";
    if (name === "protein_evidence" && d.synthesis && d.synthesis.confidence) return d.synthesis.confidence + " protein evidence";
    if (name === "isoform_risk" && d.isoform_specificity_risk) return d.isoform_specificity_risk + " risk";
    if (name === "pathway_relations" && d.literature_relations) return Object.keys(d.literature_relations).length + " relations";
    if (name === "literature_search" && Array.isArray(d.papers)) return d.papers.length + " paper" + (d.papers.length === 1 ? "" : "s");
    if (name === "target_disease_evidence" && typeof d.overall_score === "number") return "assoc " + d.overall_score.toFixed(2);
    return "done";
  }

  function ensureActivity(a) {
    if (a.activity) return a.activity;
    const box = el("details", "activity");
    box.open = true;
    const head = el("summary", "activity__head");
    head.appendChild(el("span", "activity__dot"));
    const title = el("span", "activity__title", "Working…");
    head.appendChild(title);
    const count = el("span", "activity__count", "");
    head.appendChild(count);
    head.appendChild(el("span", "activity__chev", "▸"));
    box.appendChild(head);
    const steps = el("div", "activity__steps");
    box.appendChild(steps);
    a.body.insertBefore(box, a.caret);
    a.cursorText = null;
    a.activity = { box, title, count, steps, n: 0, done: false };
    return a.activity;
  }

  function activityStep(a, name) {
    const act = ensureActivity(a);
    act.n += 1;
    act.count.textContent = act.n;
    act.title.textContent = toolLabel(name) + "…";
    const row = el("div", "step running");
    row.appendChild(el("span", "step__dot"));
    row.appendChild(el("span", "step__label", toolLabel(name)));
    const sum = el("span", "step__sum", "…");
    row.appendChild(sum);
    act.steps.appendChild(row);
    row._sum = sum;
    return row;
  }

  function activityDone(a, row, ev) {
    if (row) {
      row.classList.remove("running");
      row.classList.add(ev.is_error ? "error" : "done");
      row._sum.textContent = toolSummary(ev.tool_name, ev);
    }
    if (!ev.is_error && (ev.tool_name === "build_recommendations" || ev.tool_name === "recommend_models")) {
      let report = null;
      try { report = JSON.parse(ev.content); } catch (e) { report = null; }
      if (report && Array.isArray(report.cards)) {
        if (report.cards.length) showRecommendations(report);
        else showNoRecommendations(report);
      }
    } else if (!ev.is_error && ev.tool_name === "annotate_recommendations") {
      let data = null;
      try { data = JSON.parse(ev.content); } catch (e) { data = null; }
      if (data && Array.isArray(data.rationales)) {
        data.rationales.forEach((r) => injectWhy(r.model, r.why));
      }
    }
  }

  function injectWhy(model, why) {
    const card = cardsByName[normName(model)];
    if (!card || !why) return;
    const body = card.querySelector(".rec-body");
    if (!body) return;
    if (!card._why) {
      const block = el("div", "rec-why");
      block.appendChild(el("div", "rec-why__label", "Why this model"));
      const text = el("div", "rec-why__text md");
      block.appendChild(text);
      body.insertBefore(block, body.firstChild);
      card._why = text;
    }
    card._why.innerHTML = renderMarkdown(why);
  }

  function activityFinish(a) {
    const act = a.activity;
    if (!act || act.done) return;
    act.done = true;
    act.box.classList.add("is-done");
    act.box.open = false;
    act.title.textContent = "Gathered evidence from " + act.n + " source" + (act.n === 1 ? "" : "s");
  }

  const TIER_TOKEN = { "2d_line": "cellline", organoid: "organoid", coculture: "pdx", in_vivo: "mouse" };

  function pcRow(d, kind) {
    const row = el("div", "rec-pc__row");
    row.appendChild(el("span", "rec-pc__mark rec-pc__mark--" + kind, kind === "pro" ? "✓" : "✗"));
    const body = el("div", "rec-pc__body");
    body.appendChild(el("span", "rec-pc__text", d.label));
    const src = el("span", "rec-pc__src");
    if (d.source_url) {
      const a = el("a", null, d.source + " ↗");
      a.href = d.source_url; a.target = "_blank"; a.rel = "noopener";
      src.appendChild(a);
    } else if (d.source) {
      src.appendChild(document.createTextNode(d.source));
    }
    body.appendChild(src);
    row.appendChild(body);
    return row;
  }

  function section(label, nodes) {
    if (!nodes.length) return null;
    const s = el("div", "rec-section");
    s.appendChild(el("div", "rec-section__label", label));
    nodes.forEach((nd) => s.appendChild(nd));
    return s;
  }

  function recCard(c) {
    const card = el("details", "rec-card" + (c.recommended ? "" : " rec-card--rejected"));

    const head = el("summary", "rec-head");
    head.appendChild(el("span", "rec-chevron", "▸"));
    head.appendChild(el("span", "rec-rank", "#" + c.rank));
    head.appendChild(el("span", "rec-name", c.model_name));
    const tier = el("span", "rec-chip", c.tier_label);
    const tok = TIER_TOKEN[c.tier] || "cellline";
    tier.style.color = "var(--cellar-" + tok + ")";
    tier.style.background = "var(--cellar-" + tok + "-tint)";
    tier.style.borderColor = "var(--cellar-" + tok + "-border)";
    head.appendChild(tier);
    head.appendChild(el("span", "rec-badge " + (c.recommended ? "rec-badge--yes" : "rec-badge--no"),
      c.recommended ? "Recommended" : "Rejected"));
    const buyable = !!(c.sourcing && c.sourcing.purchasable);
    const buy = el("span", "rec-buy rec-buy--" + (buyable ? "yes" : "no"));
    buy.title = buyable ? "Available to purchase" : "No direct purchase source found";
    buy.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>';
    head.appendChild(buy);
    card.appendChild(head);

    const body = el("div", "rec-body");

    const grid = el("div", "rec-proscons");
    const proCol = el("div", "rec-pc__col rec-pc__col--pro");
    proCol.appendChild(el("div", "rec-pc__head", "Pros"));
    const pros = c.reasons || [];
    if (pros.length) pros.forEach((d) => proCol.appendChild(pcRow(d, "pro")));
    else proCol.appendChild(el("div", "rec-pc__none", "None noted"));
    const conCol = el("div", "rec-pc__col rec-pc__col--con");
    conCol.appendChild(el("div", "rec-pc__head", "Cons"));
    const cons = c.watch_outs || [];
    if (cons.length) cons.forEach((d) => conCol.appendChild(pcRow(d, "con")));
    else conCol.appendChild(el("div", "rec-pc__none", "None noted"));
    grid.appendChild(proCol);
    grid.appendChild(conCol);
    body.appendChild(grid);

    const actions = (c.mechanism && c.mechanism.actions) || [];
    const actNodes = actions.map((a) => {
      const line = a.action + (a.readout_hint ? " — unlocks: " + a.readout_hint : "");
      return el("div", "rec-action", line);
    });
    const act = section("Culture actions to make the mechanism observable", actNodes);
    if (act) body.appendChild(act);

    const notes = (c.context_notes || []).map((t) => el("div", "rec-note", t));
    const ctx = section("Context for your decision", notes);
    if (ctx) body.appendChild(ctx);

    const src = c.sourcing || {};
    const foot = el("div", "rec-foot");
    foot.appendChild(el("div", "rec-foot__label", "Where to buy"));
    const val = el("div", "rec-foot__val");
    if (src.purchasable && (src.supplier_or_cro || src.catalog_url)) {
      if (src.catalog_url) {
        const a = el("a", null, (src.supplier_or_cro || "Purchase") + " ↗");
        a.href = src.catalog_url; a.target = "_blank"; a.rel = "noopener";
        val.appendChild(a);
      } else {
        val.textContent = src.supplier_or_cro;
      }
    } else if (src.catalog_url) {
      val.appendChild(document.createTextNode("Not sold through a standard catalog — "));
      const a = el("a", null, "see record ↗");
      a.href = src.catalog_url; a.target = "_blank"; a.rel = "noopener";
      val.appendChild(a);
    } else {
      val.textContent = "No direct purchase source found.";
    }
    foot.appendChild(val);
    body.appendChild(foot);
    card.appendChild(body);
    return card;
  }

  function _resultsContext(report) {
    const q = report.query || {};
    return [q.target_symbol, q.disease, q.question_type].filter(Boolean).join(" · ");
  }

  function showRecommendations(report) {
    resultsSub.textContent = _resultsContext(report) || (report.verdict || "");
    resultsBody.replaceChildren();
    cardsByName = {};
    report.cards.forEach((c) => {
      const card = recCard(c);
      cardsByName[normName(c.model_name)] = card;
      resultsBody.appendChild(card);
    });
    resultsBody.scrollTop = 0;
    layoutEl.classList.add("has-results");
  }

  function showNoRecommendations(report) {
    resultsSub.textContent = _resultsContext(report) || "No models ranked";
    resultsBody.replaceChildren();
    const note = el("div", "results__empty");
    note.textContent = report.verdict || "No candidate models were ranked for this question.";
    resultsBody.appendChild(note);
    resultsBody.scrollTop = 0;
    layoutEl.classList.add("has-results");
  }

  function resetResultsPanel() {
    if (!layoutEl.classList.contains("has-results")) return;
    resultsSub.textContent = "Ranked models appear here.";
    resultsBody.replaceChildren();
    const note = el("div", "results__empty");
    note.textContent = "Ranked models for this question will appear here.";
    resultsBody.appendChild(note);
  }

  function send(text) {
    if (!text.trim()) return;
    clearEmptyState();
    resetResultsPanel();
    input.value = "";
    setGenerating(true);
    addUser(text);
    const a = addAssistant();
    scrollDown();
    const openTools = [];
    const es = new EventSource("/chat?message=" + encodeURIComponent(text));
    activeES = es;

    es.onmessage = (e) => {
      const ev = JSON.parse(e.data);
      const stick = isNearBottom();
      if (ev.kind === "text") { appendText(a, ev.text); }
      else if (ev.kind === "tool_use") { openTools.push(activityStep(a, ev.tool_name)); }
      else if (ev.kind === "tool_result") { activityDone(a, openTools.shift(), ev); }
      else if (ev.kind === "error") { appendText(a, "\n[error] " + (ev.content || "")); }
      else if (ev.kind === "done") { finish(); }
      if (stick) scrollDown();
    };
    es.onerror = () => finish();

    let finished = false;
    function finish(stopped) {
      if (finished) return;
      finished = true;
      es.close();
      activityFinish(a);
      a.caret.remove();
      if (stopped) a.body.appendChild(el("div", "stopped", "■ stopped"));
      activeES = null;
      activeFinish = null;
      setGenerating(false);
      input.focus();
    }
    activeFinish = finish;
  }

  function newInvestigation() {
    if (activeES) stopGeneration();
    fetch("/reset", { method: "POST" }).catch(() => {});
    messagesEl.replaceChildren();
    layoutEl.classList.remove("has-results");
    resultsBody.replaceChildren();
    resultsSub.textContent = "Ranked models appear here.";
    renderEmptyState();
    input.value = "";
    input.focus();
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (activeES) { stopGeneration(); return; }
    send(input.value);
  });
  document.getElementById("new-btn").addEventListener("click", newInvestigation);
  renderEmptyState();
  input.focus();
</script>
</body>
</html>
