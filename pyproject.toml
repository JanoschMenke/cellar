[project]
name = "cellar"
version = "0.1.0"
description = "Agentic Model Matchmaker: picks the right in-vitro biological model for testing a target in a disease."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
keywords = ["bioinformatics", "drug-discovery", "cell-lines", "agents", "llm"]
authors = [{ name = "Janosch Menke" }]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anthropic[bedrock]>=0.116.0",
    "fastapi>=0.139.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.50.0",
]

[project.urls]
Homepage = "https://github.com/JanoschMenke/cellar"
Repository = "https://github.com/JanoschMenke/cellar"

[project.scripts]
cellar-web = "cellar.web.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cellar"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
packages = ["cellar"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
